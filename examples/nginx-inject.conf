# Inject the overlay into Invidious HTML pages only.
#
# Static assets, thumbnails, the API and the companion keep your normal `location /`
# (and their upstream gzip). sub_filter only works on uncompressed responses, hence
# the empty Accept-Encoding for the HTML pages matched here.
#
# Bump ?v= after replacing the files: Invidious serves /css/* and /js/* with a
# one-month Cache-Control.

location ~ ^/(?!(css|js|videojs|fonts|vi|ggpht|sb|api|companion|favicon|apple-touch|android|safari-pinned|site\.webmanifest|robots\.txt|opensearch\.xml)) {
    proxy_pass http://invidious:3000;              # your Invidious upstream
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '<head>'  '<head><script src="/js/restyle.js?v=1"></script>';
    sub_filter '</head>' '<link rel="stylesheet" href="/css/restyle.css?v=1"></head>';
}

# Nginx Proxy Manager: paste the location block into the proxy host's "Advanced" tab,
# replacing the proxy_pass / proxy_set_header lines (except Accept-Encoding) with
#     include conf.d/include/proxy.conf;
